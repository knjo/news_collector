[project]
name = "news-collector"
version = "0.1.0"
description = "Collect, normalize, and analyze news data."
readme = "README.md"
authors = [
    { name = "knjo", email = "kevin5566c@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "polars>=1.43.0",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
news-collector = "news_collector:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
